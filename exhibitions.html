<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JINSHIUAN | Exhibitions</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans TC",sans-serif;background:#0d1421;color:#fff}
body{min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(20px,4vw,64px);border-bottom:1px solid #ffffff24}
.brand{font-size:14px;letter-spacing:3px;font-weight:700}.back{color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:999px;padding:10px 18px;font-size:14px}
main{flex:1;display:flex;flex-direction:column;padding:clamp(22px,4vw,54px) clamp(20px,4vw,64px) 36px}
.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:4px;color:#c6a45e}.heading h1{font-size:clamp(32px,5vw,58px);margin:9px 0 0;letter-spacing:1px}.heading p{color:#aeb7c6;margin:0 0 7px}
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;flex:1}
.item{min-width:0;display:flex;flex-direction:column}.media{width:100%;height:min(62vh,620px);min-height:280px;display:flex;align-items:center;justify-content:center;background:#182235;border-radius:14px;overflow:hidden}
.media img{width:100%;height:100%;object-fit:contain}.media video{width:100%;height:100%;object-fit:contain;background:#000}.caption{font-size:13px;color:#c6ccd6;padding-top:12px;letter-spacing:.5px}
footer{text-align:center;color:#7f899a;font-size:11px;padding:0 20px 22px;letter-spacing:1.5px}
@media(max-width:900px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.media{height:48vh;min-height:220px}}
@media(max-width:560px){.top{padding:17px 18px}.brand{font-size:11px;letter-spacing:2px}.heading{display:block}.heading p{margin-top:10px}.gallery{grid-template-columns:1fr}.media{height:58vh;min-height:240px}main{padding:26px 16px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html" style="color:#fff;text-decoration:none">JINSHIUAN AUTO PARTS LTD.</a><nav style="display:flex;align-items:center;gap:clamp(10px,2vw,26px);flex-wrap:wrap;justify-content:flex-end;font-size:13px"><a href="index.html#products" style="color:#fff;text-decoration:none">Products</a><a href="index.html#partsl-search" style="color:#fff;text-decoration:none">PARTSLINK SEARCH</a><a href="index.html#about" style="color:#fff;text-decoration:none">About</a><a href="index.html#contact" style="color:#fff;text-decoration:none">Contact</a><a class="back" href="index.html">返回公司首頁</a></nav></header>
<main><div class="heading"><div><div class="eyebrow">JINSHIUAN EXHIBITIONS</div><h1>展覽活動</h1></div><p>展覽現場照片與活動紀錄</p></div>
<section class="gallery" id="exhibitionGallery"><p style="color:#cbd5e1">展覽資料載入中...</p></section></main><footer>JINSHIUAN AUTO PARTS LTD. · EXHIBITIONS</footer>
<script>
(async function(){
const gallery=document.getElementById('exhibitionGallery');
const endpoint='https://mkujndpbwjwumcclafcd.supabase.co/rest/v1/exhibition_media?select=title,media_type,public_url,sort_order&active=eq.true&order=sort_order.asc,created_at.asc';
const key='sb_publishable_QwdKQAw1bqwDCF05-ghdMg_Ipj6kghD';
try{
 const response=await fetch(endpoint,{headers:{apikey:key,Authorization:'Bearer '+key}});
 if(!response.ok)throw new Error('HTTP '+response.status);
 const items=await response.json();
 gallery.replaceChildren();
 if(!items.length){const p=document.createElement('p');p.textContent='目前尚無展覽資料';gallery.appendChild(p);return;}
 items.forEach((item)=>{
  const card=document.createElement('article');card.className='item';
  const media=document.createElement('div');media.className='media';
  let element;
  if(item.media_type==='video'){element=document.createElement('video');element.controls=true;element.playsInline=true;element.preload='metadata';element.src=item.public_url;media.appendChild(element);}
  else{element=document.createElement('img');element.loading='lazy';element.alt=item.title||'JINSHIUAN 展覽照片';element.src=item.public_url;const link=document.createElement('a');link.href=item.public_url;link.target='_blank';link.rel='noopener noreferrer';link.title='點擊於新分頁開啟原尺寸照片';link.style.cssText='display:block;width:100%;height:100%;cursor:zoom-in';link.appendChild(element);media.appendChild(link);}
  const caption=document.createElement('div');caption.className='caption';caption.textContent=item.title||'JINSHIUAN EXHIBITIONS';
  card.append(media,caption);gallery.appendChild(card);
 });
}catch(error){console.error('Exhibitions load error',error);gallery.textContent='展覽資料暫時無法載入，請稍後再試。';}
})();
</script>
</body></html>
