nd:rgba(255,255,255,.08);color:#fff}.dots{display:flex;gap:6px;position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:5}.dot{width:7px;height:7px;border-radius:50%;border:0;background:#69717d;padding:0}.dot.active{background:#fff;width:24px;border-radius:9px}.section{padding:88px 0}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:34px}.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--muted);font-weight:800}.section h2{font-size:42px;letter-spacing:-.04em;margin:8px 0}.section-head p{color:var(--muted);max-width:470px;line-height:1.7}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}.filter{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;color:#555}.filter.active{background:#111827;color:#fff;border-color:#111827}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-3px);box-shadow:0 18px 45px rgba(15,23,42,.08)}.card-img{height:245px;background:#f7f7f7;display:flex;align-items:center;justify-content:center;padding:18px}.card-img img{max-width:100%;max-height:100%;object-fit:contain}.card-body{padding:18px}.card-body h3{margin:0 0 8px;font-size:16px}.meta{font-size:12px;color:var(--muted)}.about{background:var(--soft)}.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.about h2{margin-top:10px}.about p{color:#59616d;line-height:1.85}.contact-box{background:#111827;color:#fff;border-radius:26px;padding:48px;display:flex;justify-content:space-between;align-items:center;gap:30px}.contact-box p{color:#b8c0cc}.footer{border-top:1px solid var(--line);padding:28px 0;color:#7a818c;font-size:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{background:#fff;max-width:980px;width:100%;max-height:90vh;overflow:auto;border-radius:22px;padding:24px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}.modal-img{min-height:400px;background:#f7f7f7;border-radius:16px;display:flex;align-items:center;justify-content:center}.modal-img img{max-width:100%;max-height:500px}.close{float:right;border:0;background:#f0f2f5;border-radius:50%;width:36px;height:36px}.admin{background:#f5f6f8;min-height:100vh}.admin-head{background:#111827;color:#fff;padding:24px 0}.admin-nav{display:flex;gap:10px;flex-wrap:wrap}.admin-layout{display:grid;grid-template-columns:280px 1fr;gap:20px;padding:24px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.side button{width:100%;text-align:left;margin-bottom:8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#66707d;font-weight:700}.field input,.field textarea,.field select{border:1px solid #dfe3e8;border-radius:10px;padding:11px 12px;background:#fff}.field textarea{min-height:100px;resize:vertical}.thumb{width:100%;height:150px;object-fit:contain;background:#f7f7f7;border-radius:12px}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}.actions{display:flex;gap:6px;flex-wrap:wrap}.status{display:inline-flex;padding:4px 8px;border-radius:99px;background:#eef2f7;color:#4b5563;font-size:11px}.notice{padding:12px 14px;border-radius:12px;background:#f2f4f7;color:#59616d;font-size:12px;line-height:1.6;margin-bottom:15px}.preview-frame{width:100%;height:720px;border:1px solid var(--line);border-radius:16px;background:#fff}.empty{padding:60px;text-align:center;color:var(--muted)}.pl-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pl-toolbar input{flex:1;min-width:220px;bord </style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>#loginGate{position:fixed;inset:0;background:#f5f6f8;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}#loginGate .login-box{background:#fff;border:1px solid #e7e9ed;border-radius:20px;padding:32px;max-width:420px;width:100%;box-shadow:0 18px 50px rgba(15,23,42,.08)}#loginGate h2{margin:0 0 8px}#loginGate p{color:#69717d;line-height:1.6;font-size:13px}#loginGate input{width:100%;border:1px solid #dfe3e8;border-radius:10px;padding:12px;margin:6px 0 12px}</style></head><body class="admin"><div id="loginGate"><div class="login-box"><div class="eyebrow">JINSHIUAN ADMIN</div><h2>網站後台登入</h2><p>請使用你在 Supabase Authentication 建立的管理員帳號登入。</p><form id="loginForm"><label class="meta">Email</label><input id="loginEmail" type="email" required autocomplete="username"><label class="meta">密碼</label><input id="loginPassword" type="password" required autocomplete="current-password"><button class="btn dark" type="submit" style="width:100%;margin-top:6px">登入</button></form><div id="loginMsg" class="notice" style="margin-top:14px;display:none"></div></div></div><header class="admin-head"><div class="wrap"><div style="display:flex;justify-content:space-between;gap:20px;align-items:center"><div><div style="font-weight:900;letter-spacing:.12em">JINSHIUAN WEBSITE MANAGEMENT</div><div style="font-size:12px;color:#aeb6c2;margin-top:5px">Supabase 雲端產品管理</div></div><div class="admin-nav"><button class="btn" onclick="show(&#39;preview&#39;)">預覽前台</button><button class="btn" onclick="syncLocalToCloud()">同步本機資料到雲端</button><button class="btn" onclick="logout()">登出</button></div></div></div></header>
<div class="wrap admin-layout"><aside class="panel side"><button class="btn dark" onclick="show(&#39;products&#39;)">產品管理</button><button class="btn" onclick="show(&#39;add&#39;)">＋ 新增產品</button><button class="btn" onclick="show(&#39;partslik&#39;)">PARTSLINK 資料管理</button><button class="btn" onclick="show(&#39;preview&#39;)">網站預覽</button><button class="btn" onclick="exportData()">備份產品資料</button><button class="btn" onclick="importData()">還原產品資料</button><div class="notice" style="margin-top:18px">目前產品資料與圖片會儲存在 Supabase 雲端；登入後即可從不同電腦管理。仍可使用「備份產品資料」做本機備份。</div></aside><main id="main"><section class="panel"><div class="section-head" style="margin-bottom:18px"><div><div class="eyebrow">PRODUCT MANAGEMENT</div><h2 style="font-size:30px">產品管理</h2></div><button class="btn dark" onclick="show(&#39;add&#39;)">＋ 新增產品</button></div><div class="notice">可直接修改產品資料；「停用」不會刪除資料，正式網站不會顯示停用產品。</div><table class="admin-table"><thead><tr><th>圖片</th><th>產品</th><th>料號</th><th>分類</th><th>狀態</th><th>操作</th></tr></thead><tbody><tr><td><img src="assets/image-14.webp" style="width:90px;height:60px;object-fit:contain;background:#f7f7f7;border-radius:8px"><br><span class="meta">1 張</span></td><td><b>保桿</b><br><span class="meta"></span></td><td>-</td><td>保桿</td><td><span class="status">啟用中</span></td><td><div class="actions"><button class="btn" onclick="show(&#39;add&#39;,&#39;BUMPER_TEST_01&#39;)">編輯</button><button class="btn" onclick="toggle(&#39;BUMPER_TEST_01&#39;)">停用</button><button class="btn" onclick="move(&#39;BUMPER_TEST_01&#39;,-1)">↑</button><button class="btn" onclick="move(&#39;BUMPER_TEST_01&#39;,1)">↓</button><button class="btn" onclick="removeP(&#39;BUMPER_TEST_01&#39;)">刪除</button></div></td></tr></tbody></table></section></main></div>
<script>const SUPABASE_URL='https://mkujndpbwjwumcclafcd.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_QwdKQAw1bqwDCF05-ghdMg_Ipj6kghD';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let products=[];let currentUser=null;
function productImages(p){return Array.isArray(p.images)?p.images:(p.image?[p.image]:[])}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function showLoginMsg(msg){const el=document.getElementById('loginMsg');el.textContent=msg;el.style.display='block'}
function adminImageCell(p){const ims=productImages(p);return ims.length?'<img src="'+esc(ims[0])+'" style="width:90px;height:60px;object-fit:contain;background:#f7f7f7;border-radius:8px"><br><span class="meta">'+ims.length+' 張</span>':'<div style="width:90px;height:60px;background:#f7f7f7;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#9aa1aa;font-size:11px">無圖片</div><br><span class="meta">0 張</span>'}
async function loadProducts(){const {data,error}=await sb.from('products').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:true});if(error){console.error(error);alert('讀取雲端產品失敗：'+error.message);products=[];return}products=(data||[]).map(r=>({id:r.id,name:r.name,partNo:r.part_no||'',category:r.category||'Automotive Parts',vehicle:r.vehicle||'',description:r.description||'',images:Array.isArray(r.images)?r.images:[],image:(Array.isArray(r.images)&&r.images[0])||'',active:r.active!==false,sort_order:r.sort_order||0}));show('products')}
async function loadPartslik(){
  const q=(document.getElementById('plSearch')?.value||'').trim();
  const page=window.plPage||0, size=50;
  let query=sb.from('partslik_data').select('id,vehicle,year,part_name,position,oem_no,partslik_no',{count:'exact'}).order('id',{ascending:true}).range(page*size,page*size+size-1);
  if(q){const safe=q.replace(/\\/g,'\\\\').replace(/%/g,'\\%').replace(/_/g,'\\_');query=query.or(`partslik_no.ilike.%${safe}%,oem_no.ilike.%${safe}%,vehicle.ilike.%${safe}%`)}
  const {data,error,count}=await query;
  const box=document.getElementById('plResults'); if(!box)return;
  if(error){box.innerHTML='<div class="notice">讀取 PARTSLINK 資料失敗：'+esc(error.message)+'</div>';return}
  const rows=data||[];
  box.innerHTML=`<div class="pl-small">共 ${count||0} 筆資料，目前顯示第 ${rows.length? page*size+1:0}～${page*size+rows.length} 筆</div><div class="pl-table-wrap"><table class="admin-table"><thead><tr><th>車名</th><th>年份</th><th>車部品別</th><th>位置</th><th>OEM#</th><th>PARTSLINK#</th><th>操作</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${esc(r.vehicle||'')}</td><td>${esc(r.year||'')}</td><td>${esc(r.part_name||'')}</td><td>${esc(r.position||'')}</td><td>${esc(r.oem_no||'')}</td><td><b>${esc(r.partslik_no||'')}</b></td><td><div class="actions"><button class="btn" onclick="editPartslik(${r.id})">編輯</button><button class="btn" onclick="deletePartslik(${r.id})">刪除</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="empty">找不到資料</td></tr>'}</tbody></table></div><div class="pl-pagination"><button class="btn" ${page<=0?'disabled':''} onclick="plPage(-1)">上一頁</button><span class="pl-badge">第 ${page+1} 頁</span><button class="btn" ${rows.length<size?'disabled':''} onclick="plPage(1)">下一頁</button></div>`;
}
function plPage(d){window.plPage=Math.max(0,(window.plPage||0)+d);loadPartslik()}
function newPartslik(){show('partslikEdit')}
async function editPartslik(id){const {data,error}=await sb.from('partslik_data').select('*').eq('id',id).single();if(error)return alert('讀取資料失敗：'+error.message);show('partslikEdit',data)}
async function savePartslik(e){e.preventDefault();const f=e.target;const payload={vehicle:f.vehicle.value.trim()||null,year:f.year.value.trim()||null,part_name:f.part_name.value.trim()||null,position:f.position.value.trim()||null,oem_no:f.oem_no.value.trim()||null,partslik_no:f.partslik_no.value.trim()||null};if(!payload.partslik_no&&!payload.oem_no)return alert('PARTSLINK# 或 OEM# 至少要填一個。');const id=f.dataset.id;const r=id?await sb.from('partslik_data').update(payload).eq('id',id):await sb.from('partslik_data').insert(payload);if(r.error)return alert('儲存失敗：'+r.error.message);alert(id?'PARTSLINK 資料已更新！':'PARTSLINK 資料已新增！');window.plPage=0;show('partslik')}
async function deletePartslik(id){if(!confirm('確定刪除這筆 PARTSLINK 資料？'))return;const r=await sb.from('partslik_data').delete().eq('id',id);if(r.error)return alert('刪除失敗：'+r.error.message);await loadPartslik()}
function downloadPartslikTemplate(){const csv='車名,年份,車部品別,部品位置,OEM#,PARTSLINK#\\nF-150,2010-2013,Front bumper cover upper,FT,AL3Z17D957CPTM,FO1014111\\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='PARTSLINK_import_template.csv';a.click()}
function parseCsvLine(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
async function importPartslikCsv(){const input=document.getElementById('plCsv');const file=input?.files?.[0];if(!file)return alert('請先選擇 CSV 檔案。');if(!confirm('確定將 CSV 資料匯入雲端？這會新增資料，不會自動刪除原有資料。'))return;try{const text=await file.text();const lines=text.replace(/^\\ufeff/,'').split(/\\r?\\n/).filter(x=>x.trim());if(lines.length<2)return alert('CSV 沒有可匯入的資料。');const rows=lines.slice(1).map(parseCsvLine).filter(r=>r.some(x=>x.trim()));const payload=rows.map(r=>({vehicle:r[0]?.trim()||null,year:r[1]?.trim()||null,part_name:r[2]?.trim()||null,position:r[3]?.trim()||null,oem_no:r[4]?.trim()||null,partslik_no:r[5]?.trim()||null})).filter(r=>r.partslik_no||r.oem_no);if(!payload.length)return alert('找不到有效資料。請確認欄位順序為：車名、年份、車部品別、部品位置、OEM#、PARTSLINK#。');let added=0;for(let i=0;i<payload.length;i+=500){const r=await sb.from('partslik_data').insert(payload.slice(i,i+500));if(r.error)throw r.error;added+=Math.min(500,payload.length-i)}alert('匯入完成！新增 '+added+' 筆資料。');input.value='';window.plPage=0;await loadPartslik()}catch(err){console.error(err);alert('匯入失敗：'+(err?.message||'請檢查 CSV 格式與權限。'))}}
function show(tab,edit=null){document.body.classList.toggle('preview-only',tab==='preview');const m=document.getElementById('main');if(tab==='products'){m.innerHTML=`<section class="panel"><div class="section-head" style="margin-bottom:18px"><div><div class="eyebrow">PRODUCT MANAGEMENT</div><h2 style="font-size:30px">產品管理</h2></div><button class="btn dark" onclick="show('add')">＋ 新增產品</button></div><div class="notice">這裡的資料就是雲端資料庫；新增、修改、停用、刪除後，公開網站會讀取最新資料。</div><table class="admin-table"><thead><tr><th>圖片</th><th>產品</th><th>料號</th><th>分類</th><th>狀態</th><th>操作</th></tr></thead><tbody>${products.map(p=>`<tr><td>${adminImageCell(p)}</td><td><b>${esc(p.name)}</b><br><span class="meta">${esc(p.vehicle||'')}</span></td><td>${esc(p.partNo||'-')}</td><td>${esc(p.category||'-')}</td><td><span class="status">${p.active===false?'已停用':'啟用中'}</span></td><td><div class="actions"><button class="btn" onclick="show('add','${p.id}')">編輯</button><button class="btn" onclick="toggle('${p.id}')">${p.active===false?'啟用':'停用'}</button><button class="btn" onclick="move('${p.id}',-1)">↑</button><button class="btn" onclick="move('${p.id}',1)">↓</button><button class="btn" onclick="removeP('${p.id}')">刪除</button></div></td></tr>`).join('')}</tbody></table></section>`}
else if(tab==='add'){let p=edit?products.find(x=>x.id===edit):{id:null,name:'',partNo:'',category:'Automotive Parts',vehicle:'',description:'',images:[],image:'',active:true,sort_order:products.length};if(!p)p={id:null,name:'',partNo:'',category:'Automotive Parts',vehicle:'',description:'',images:[],image:'',active:true,sort_order:products.length};const currentImages=productImages(p).slice();let removed=new Set();let newFiles=[];m.innerHTML=`<section class="panel"><div class="eyebrow">${edit?'EDIT PRODUCT':'NEW PRODUCT'}</div><h2 style="font-size:30px">${edit?'編輯產品':'新增產品'}</h2><div class="notice">圖片會直接上傳到 Supabase Storage 的 product-images。建議使用 JPG、PNG 或 WebP。</div><form id="form"><div class="form-grid"><div class="field full"><label>產品圖片（不限張數）</label><input id="img" type="file" accept="image/*" multiple><div class="meta" style="margin:8px 0">可一次選擇多張圖片。</div><button type="button" class="btn" id="clearAllImages" style="margin-bottom:10px">清除目前全部圖片</button><div id="imgPreview" style="display:flex;flex-wrap:wrap;gap:10px"></div></div><div class="field"><label>產品名稱</label><input id="name" required value="${esc(p.name)}"></div><div class="field"><label>產品編號 / Part No.</label><input id="partNo" value="${esc(p.partNo)}"></div><div class="field"><label>產品分類</label><input id="category" value="${esc(p.category)}"></div><div class="field"><label>適用車型</label><input id="vehicle" value="${esc(p.vehicle)}"></div><div class="field full"><label>產品說明</label><textarea id="description">${esc(p.description)}</textarea></div></div><div style="display:flex;gap:8px;margin-top:20px"><button type="submit" id="saveProductBtn" class="btn dark">儲存到雲端</button><button type="button" class="btn" onclick="show('products')">取消</button></div></form></section>`;const preview=document.getElementById('imgPreview');function renderImgs(){preview.innerHTML='';currentImages.forEach((im,i)=>{if(removed.has(i))return;const w=document.createElement('div');w.style.cssText='position:relative';w.innerHTML='<img class="thumb" src="'+esc(im)+'"><button type="button" class="btn" style="position:absolute;right:3px;top:3px;padding:4px 7px">×</button>';w.querySelector('button').onclick=()=>{removed.add(i);renderImgs()};preview.appendChild(w)});newFiles.forEach((f,i)=>{const w=document.createElement('div');w.style.cssText='position:relative';const im=document.createElement('img');im.className='thumb';im.src=f.preview;const b=document.createElement('button');b.type='button';b.className='btn';b.textContent='×';b.style.cssText='position:absolute;right:3px;top:3px;padding:4px 7px';b.onclick=()=>{newFiles.splice(i,1);renderImgs()};w.appendChild(im);w.appendChild(b);preview.appendChild(w)})}renderImgs();document.getElementById('clearAllImages').onclick=()=>{removed=new Set(currentImages.map((_,i)=>i));newFiles=[];renderImgs()};document.getElementById('img').onchange=e=>{Array.from(e.target.files||[]).forEach(file=>{const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(blob=>{if(blob){newFiles.push({blob,preview:URL.createObjectURL(blob)});renderImgs()}},'image/webp',0.8)};im.src=reader.result};reader.readAsDataURL(file)});e.target.value=''};document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('saveProductBtn');btn.disabled=true;btn.textContent='上傳並儲存中...';try{const name=document.getElementById('name').value.trim();if(!name){alert('請先輸入產品名稱');return}let images=currentImages.filter((_,i)=>!removed.has(i));for(const item of newFiles){const path=currentUser.id+'/product-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.webp';const up=await sb.storage.from('product-images').upload(path,item.blob,{contentType:'image/webp',upsert:false});if(up.error)throw up.error;images.push(sb.storage.from('product-images').getPublicUrl(path).data.publicUrl)}const payload={name,part_no:document.getElementById('partNo').value.trim()||null,category:document.getElementById('category').value.trim()||'Automotive Parts',vehicle:document.getElementById('vehicle').value.trim()||null,description:document.getElementById('description').value.trim()||null,images,active:p.active!==false,sort_order:p.sort_order??products.length,updated_at:new Date().toISOString()};const result=p.id?await sb.from('products').update(payload).eq('id',p.id):await sb.from('products').insert(payload);if(result.error)throw result.error;alert('產品已成功儲存到雲端！');await loadProducts()}catch(err){console.error(err);alert('儲存失敗：'+(err?.message||'請稍後再試。'))}finally{btn.disabled=false;btn.textContent='儲存到雲端'}})}
else if(tab==='partslik'){
 window.plPage=window.plPage||0;m.innerHTML=`<section class="panel"><div class="section-head" style="margin-bottom:18px"><div><div class="eyebrow">PARTSLINK DATABASE</div><h2 style="font-size:30px">PARTSLINK 資料管理</h2></div><button class="btn dark" onclick="newPartslik()">＋ 新增資料</button></div><div class="notice">這裡管理客戶網站的 PARTSLINK／OEM 雲端資料。修改後，客戶網站搜尋會直接使用最新資料。</div><div class="pl-toolbar"><input id="plSearch" placeholder="搜尋 PARTSLINK#、OEM# 或車名"><button class="btn dark" onclick="window.plPage=0;loadPartslik()">搜尋</button><button class="btn" onclick="document.getElementById('plSearch').value='';window.plPage=0;loadPartslik()">清除</button></div><div class="csv-box"><b>批次匯入</b><div class="pl-small" style="margin:7px 0 10px">CSV 欄位順序：車名、年份、車部品別、部品位置、OEM#、PARTSLINK#。匯入只會新增，不會刪除現有資料。</div><button class="btn" onclick="downloadPartslikTemplate()">下載 CSV 範例</button> <input id="plCsv" type="file" accept=".csv,text/csv" style="margin-left:8px"><button class="btn dark" onclick="importPartslikCsv()">匯入 CSV</button></div><div id="plResults" style="margin-top:18px"></div></section>`;document.getElementById('plSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){window.plPage=0;loadPartslik()}});loadPartslik()}
else if(tab==='partslikEdit'){
 const p=edit||{};m.innerHTML=`<section class="panel"><div class="eyebrow">PARTSLINK EDITOR</div><h2 style="font-size:30px">${p.id?'編輯 PARTSLINK':'新增 PARTSLINK'}</h2><div class="notice">PARTSLINK# 或 OEM# 至少填一個。請盡量保留原始資料格式。</div><form id="plForm" data-id="${p.id||''}" class="pl-form"><div class="field"><label>車名</label><input name="vehicle" value="${esc(p.vehicle||'')}"></div><div class="field"><label>年份</label><input name="year" value="${esc(p.year||'')}"></div><div class="field"><label>車部品別</label><input name="part_name" value="${esc(p.part_name||'')}"></div><div class="field"><label>部品位置</label><input name="position" value="${esc(p.position||'')}"></div><div class="field"><label>OEM#</label><input name="oem_no" value="${esc(p.oem_no||'')}"></div><div class="field"><label>PARTSLINK#</label><input name="partslik_no" value="${esc(p.partslik_no||'')}"></div><div class="field full" style="display:flex;flex-direction:row;gap:8px"><button class="btn dark" type="submit">儲存到雲端</button><button class="btn" type="button" onclick="show('partslik')">取消</button></div></form></section>`;document.getElementById('plForm').addEventListener('submit',savePartslik)}
else if(tab==='preview'){m.innerHTML=`<section class="panel"><div class="section-head"><div><div class="eyebrow">LIVE PREVIEW</div><h2 style="font-size:30px">網站預覽</h2></div></div><iframe class="preview-frame" id="frame"></iframe></section>`;document.getElementById('frame').src='index.html?preview='+Date.now()}}
async function toggle(id){const p=products.find(x=>x.id===id);if(!p)return;const r=await sb.from('products').update({active:!p.active,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert('更新失敗：'+r.error.message);await loadProducts()}
async function removeP(id){if(!confirm('確定刪除此產品？'))return;const r=await sb.from('products').delete().eq('id',id);if(r.error)return alert('刪除失敗：'+r.error.message);await loadProducts()}
async function move(id,d){const i=products.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=products.length)return;const a=products[i],b=products[j];let r=await sb.from('products').update({sort_order:b.sort_order??j,updated_at:new Date().toISOString()}).eq('id',a.id);if(r.error)return alert('排序更新失敗：'+r.error.message);r=await sb.from('products').update({sort_order:a.sort_order??i,updated_at:new Date().toISOString()}).eq('id',b.id);if(r.error)return alert('排序更新失敗：'+r.error.message);await loadProducts()}
async function syncLocalToCloud(){const raw=localStorage.getItem('jinshiuanProducts');if(!raw)return alert('這台電腦目前沒有可同步的本機產品資料。');let local;try{local=JSON.parse(raw)}catch{return alert('本機資料格式錯誤。')}if(!Array.isArray(local)||!local.length)return alert('沒有本機產品可同步。');if(!confirm('將本機產品資料同步到雲端？已存在的同名產品可能會被略過。'))return;try{const {data:existing,error}=await sb.from('products').select('id,name,part_no,category');if(error)throw error;let added=0;for(const p of local){const hit=(existing||[]).find(x=>x.name===p.name&&(x.part_no||'')===(p.partNo||'')&&(x.category||'')===(p.category||''));if(hit)continue;const srcs=Array.isArray(p.images)?p.images.slice():(p.image?[p.image]:[]);let uploaded=[];for(const src of srcs){if(String(src).startsWith('data:')){const res=await fetch(src);const blob=await res.blob();const path=currentUser.id+'/migrated-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.webp';const up=await sb.storage.from('product-images').upload(path,blob,{contentType:blob.type||'image/webp',upsert:false});if(up.error)throw up.error;uploaded.push(sb.storage.from('product-images').getPublicUrl(path).data.publicUrl)}else if(String(src).startsWith('http'))uploaded.push(src)}const ins=await sb.from('products').insert({name:p.name||'Automotive Part',part_no:p.partNo||null,category:p.category||'Automotive Parts',vehicle:p.vehicle||null,description:p.description||null,images:uploaded,active:p.active!==false,sort_order:added});if(ins.error)throw ins.error;added++}alert('同步完成！新增 '+added+' 筆雲端產品。');await loadProducts()}catch(err){console.error(err);alert('同步失敗：'+(err?.message||'請稍後再試。'))}}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(products,null,2)],{type:'application/json'}));a.download='JINSHIUAN_products_cloud_backup.json';a.click()}

function downloadSite(){window.open('index.html','_blank')}
function logout(){sb.auth.signOut().then(()=>location.reload())}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('loginGate').style.display='flex';return}currentUser=session.user;document.getElementById('loginGate').style.display='none';await loadProducts()}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='登入中...';try{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await boot()}catch(err){showLoginMsg('登入失敗：'+(err?.message||'請確認 Email 與密碼。'))}finally{btn.disabled=false;btn.textContent='登入'}});
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')location.reload();if(session){currentUser=session.user;document.getElementById('loginGate').style.display='none'}});boot();
