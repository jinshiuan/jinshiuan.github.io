<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JINSHIUAN | Exhibition Photo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans TC",sans-serif;background:#0d1421;color:#fff}
body{min-height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px clamp(18px,4vw,56px);border-bottom:1px solid #ffffff24}
.brand{color:#fff;text-decoration:none;font-size:14px;letter-spacing:3px;font-weight:700}.nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-size:13px}
main{width:100%;max-width:1500px;margin:0 auto;padding:28px clamp(16px,4vw,56px) 42px;flex:1;display:flex;flex-direction:column}
.actions{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}.back{color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:999px;padding:10px 18px;font-size:13px}.title{font-size:clamp(20px,3vw,30px);margin:0;color:#e8edf5}
.viewer{flex:1;min-height:65vh;display:flex;align-items:center;justify-content:center;background:#05080e;border-radius:14px;overflow:hidden;padding:8px}
.viewer img{display:block;max-width:100%;max-height:75vh;width:auto;height:auto;object-fit:contain}.viewer video{display:block;width:100%;height:calc(100vh - 230px);max-height:82vh;object-fit:contain;background:#000}
.message{color:#cbd5e1;text-align:center;padding:50px 10px}footer{text-align:center;color:#7f899a;font-size:11px;padding:0 20px 22px;letter-spacing:1.5px}
@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.nav{gap:12px}.actions{align-items:flex-start;flex-direction:column}.viewer{min-height:45vh;padding:5px}}
</style></head>
<body>
<header class="top"><a class="brand" href="index.html">JINSHIUAN AUTO PARTS LTD.</a><nav class="nav"><a href="index.html#products">Products</a><a href="index.html#partsl-search">PARTSLINK SEARCH</a><a href="index.html#about">About</a><a href="index.html#contact">Contact</a></nav></header>
<main><div class="actions"><h1 class="title" id="photoTitle">展覽照片</h1><a class="back" href="exhibitions.html">← 返回展覽專區</a></div><section class="viewer" id="viewer"><p class="message">照片載入中...</p></section></main>
<footer>JINSHIUAN AUTO PARTS LTD. · EXHIBITIONS</footer>
<script>
(async function(){
 const viewer=document.getElementById('viewer'), title=document.getElementById('photoTitle');
 const id=new URLSearchParams(location.search).get('id');
 const key='sb_publishable_QwdKQAw1bqwDCF05-ghdMg_Ipj6kghD';
 if(!id){viewer.innerHTML='<p class="message">找不到照片編號，請返回展覽專區。</p>';return;}
 try{
  const url='https://mkujndpbwjwumcclafcd.supabase.co/rest/v1/exhibition_media?select=id,title,media_type,public_url&id=eq.'+encodeURIComponent(id)+'&active=eq.true';
  const response=await fetch(url,{headers:{apikey:key,Authorization:'Bearer '+key}});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const rows=await response.json(), item=rows[0];
  if(!item){viewer.innerHTML='<p class="message">此展覽照片不存在或已下架。</p>';return;}
  title.textContent=item.title||'JINSHIUAN 展覽照片';
  viewer.replaceChildren();
  if(item.media_type==='video'){
   const wrap=document.createElement('div');wrap.style.cssText='width:100%;display:flex;flex-direction:column;align-items:center;gap:18px';
   const video=document.createElement('video');video.src=item.public_url;video.controls=true;video.playsInline=true;video.preload='auto';video.setAttribute('controlsList','nodownload');video.style.cssText='display:block;width:100%;height:calc(100vh - 230px);max-height:82vh;object-fit:contain;background:#000';
   video.addEventListener('error',()=>{const warning=document.createElement('p');warning.textContent='此 MOV 影片可能不受目前瀏覽器支援，請使用下方原始影片連結播放或下載。';warning.style.cssText='color:#f3c879;text-align:center;margin:0';wrap.appendChild(warning);});
   const direct=document.createElement('a');direct.href=item.public_url;direct.target='_blank';direct.rel='noopener noreferrer';direct.textContent='無法播放？點此開啟原始影片';direct.style.cssText='color:#e7c477;text-decoration:underline;font-size:14px';
   wrap.append(video,direct);viewer.appendChild(wrap);
  }else{
   const img=document.createElement('img');img.src=item.public_url;img.alt=item.title||'JINSHIUAN 展覽照片';img.onload=()=>{document.title=(item.title||'展覽照片')+' | JINSHIUAN';};viewer.appendChild(img);
  }
 }catch(error){console.error(error);viewer.innerHTML='<p class="message">照片載入失敗，請稍後再試。</p>';}
})();
</script></body></html>
