name: Fix homepage hero swap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix hero layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('grid-template-columns:40% 60%;', 'grid-template-columns:60% 40%;', 1)
          s = s.replace('padding:10px;order:2}', 'padding:10px;order:1}', 1)
          if s == old:
              raise SystemExit('No expected hero layout pattern found.')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix factory and AUTO PARTS hero positions'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/fix-hero-swap.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary hero swap workflow' || true
          git push || true
