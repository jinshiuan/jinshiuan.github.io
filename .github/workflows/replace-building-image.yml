name: Replace homepage building image

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  replace-building:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace only the homepage building image reference
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = 'assets/jinshiuan-building-clean.png?v=2026091601'
          new = 'assets/jinshiuan-building-new(1).png?v=2026092101'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly 1 old building-image reference, found {count}")
          p.write_text(s.replace(old, new), encoding="utf-8")

      - name: Commit the one-line image reference change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use new homepage building image"
          git push
