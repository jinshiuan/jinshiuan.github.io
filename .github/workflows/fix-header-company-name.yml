name: Fix header company name graphic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert company name graphic into header
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'id="jinshiuan-company-name-fix"'
          if marker not in s:
              block = '''<style id="jinshiuan-company-name-fix">\n.site-header-company-name{display:inline-flex!important;align-items:center!important;margin-left:14px!important;height:52px!important;max-width:360px!important;width:auto!important;vertical-align:middle!important;}\n.site-header-company-name img{display:block!important;height:52px!important;width:auto!important;max-width:360px!important;object-fit:contain!important;}\n@media(max-width:700px){.site-header-company-name{height:34px!important;max-width:230px!important;margin-left:8px!important}.site-header-company-name img{height:34px!important;max-width:230px!important}}\n</style>\n<script id="jinshiuan-company-name-script">\ndocument.addEventListener('DOMContentLoaded',function(){\n  const src='assets/jinshiuan-company-name.webp?v='+Date.now();\n  const els=[...document.querySelectorAll('header *, nav *, body *')];\n  const target=els.find(e=>e.children.length===0 && e.textContent.trim()==='JINSHIUAN AUTO PARTS LTD.');\n  if(target){target.outerHTML='<span class="site-header-company-name"><img src="'+src+'" alt="JINSHIUAN AUTO PARTS LTD."></span>';return;}\n  const logo=[...document.images].find(i=>/jinshiuan|logo/i.test(i.alt+' '+i.src));\n  if(logo && logo.parentElement && !document.querySelector('.site-header-company-name')){logo.insertAdjacentHTML('afterend','<span class="site-header-company-name"><img src="'+src+'" alt="JINSHIUAN AUTO PARTS LTD."></span>');}\n});\n</script>\n'''
              s=s.replace('</head>',block+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix header company name graphic placement"
          git push
