name: Final clean building logo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'Final clean building logo') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the exact website header JS logo
        run: |
          python3 -m pip install --quiet pillow opencv-python-headless
          python3 - <<'PY'
          import cv2, numpy as np
          base=cv2.imread('assets/jinshiuan-building.png')
          header=cv2.imread('assets/jinshiuan-logo-header.webp')
          # Exact JS emblem used by the website header; exclude the white page margin.
          logo=header[2:63,6:66]
          src=np.float32([[0,0],[59,0],[59,60],[0,60]])
          dst=np.float32([[514,274],[608,260],[608,370],[515,382]])
          M=cv2.getPerspectiveTransform(src,dst)
          warped=cv2.warpPerspective(logo,M,(base.shape[1],base.shape[0]),flags=cv2.INTER_LANCZOS4,borderMode=cv2.BORDER_CONSTANT,borderValue=(255,255,255))
          # Paint the existing sign cleanly, then place the exact website emblem over it.
          sign=np.zeros((base.shape[0],base.shape[1]),np.uint8)
          cv2.fillConvexPoly(sign,np.int32(dst),255)
          base[sign>0]=warped[sign>0]
          cv2.imwrite('assets/jinshiuan-building.png',base,[cv2.IMWRITE_PNG_COMPRESSION,6])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jinshiuan-building.png
          git rm .github/workflows/final-clean-building-logo.yml
          git commit -m "Final clean building logo"
          git push
