name: Connect homepage carousel to cloud products

on:
  push:
    paths:
      - '.github/carousel-sync.trigger'

permissions:
  contents: write

jobs:
  connect-carousel:
    runs-on: ubuntu-latest
    steps:
      - name: Patch homepage carousel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, re, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          api = f'https://api.github.com/repos/{repo}/contents/index.html?ref=main'
          req = urllib.request.Request(api, headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req) as r: obj = json.load(r)
          text = base64.b64decode(obj['content']).decode('utf-8')
          dynamic = '''<script>
          const HOME_CAROUSEL_SUPABASE_URL='https://mkujndpbwjwumcclafcd.supabase.co';
          const HOME_CAROUSEL_SUPABASE_KEY='sb_publishable_QwdKQAw1bqwDCF05-ghdMg_Ipj6kghD';
          let homeCarouselIdx=0,homeCarouselTimer=null,HOME_CAROUSEL_IMAGES=[];
          const HOME_CAROUSEL_FALLBACK=["assets/image-01.webp","assets/image-02.webp","assets/image-03.webp","assets/image-04.webp","assets/image-05.webp","assets/image-06.webp","assets/image-07.webp","assets/image-08.webp","assets/image-09.webp","assets/image-10.webp","assets/image-11.webp","assets/image-12.webp","assets/image-13.webp","assets/image-14.webp"];
          function renderHomeCarousel(){const v=document.getElementById('homeCarouselViewport'),d=document.getElementById('homeCarouselDots');if(!v||!d||!HOME_CAROUSEL_IMAGES.length)return;homeCarouselIdx=(homeCarouselIdx+HOME_CAROUSEL_IMAGES.length)%HOME_CAROUSEL_IMAGES.length;v.innerHTML=HOME_CAROUSEL_IMAGES.map((src,i)=>'<div class="home-carousel-slide '+(i===homeCarouselIdx?'active':'')+'"><img src="'+src+'" alt="JINSHIUAN Automotive Part '+String(i+1).padStart(2,'0')+'" loading="'+(i===0?'eager':'lazy')+'"></div>').join('');d.innerHTML=HOME_CAROUSEL_IMAGES.map((_,i)=>'<button type="button" class="home-carousel-dot '+(i===homeCarouselIdx?'active':'')+'" aria-label="Product '+(i+1)+'" onclick="homeCarouselGo('+i+')"></button>').join('')}
          function homeCarouselGo(n){homeCarouselIdx=(n+HOME_CAROUSEL_IMAGES.length)%HOME_CAROUSEL_IMAGES.length;renderHomeCarousel();startHomeCarousel()}
          function startHomeCarousel(){clearInterval(homeCarouselTimer);homeCarouselTimer=setInterval(()=>homeCarouselGo(homeCarouselIdx+1),4000)}
          async function loadHomeCarouselFromCloud(){try{const u=HOME_CAROUSEL_SUPABASE_URL+'/rest/v1/products?select=images,sort_order&active=eq.true&order=sort_order.asc';const r=await fetch(u,{headers:{apikey:HOME_CAROUSEL_SUPABASE_KEY,Authorization:'Bearer '+HOME_CAROUSEL_SUPABASE_KEY}});if(!r.ok)throw new Error('Supabase HTTP '+r.status);const rows=await r.json();const cloud=[];for(const p of (Array.isArray(rows)?rows:[])){const imgs=Array.isArray(p.images)?p.images:[];for(const src of imgs)if(typeof src==='string'&&src.trim())cloud.push(src.trim())}HOME_CAROUSEL_IMAGES=cloud.length?cloud:HOME_CAROUSEL_FALLBACK.slice()}catch(e){console.warn('Homepage cloud carousel load failed; using existing carousel images.',e);HOME_CAROUSEL_IMAGES=HOME_CAROUSEL_FALLBACK.slice()}renderHomeCarousel();startHomeCarousel()}
          document.getElementById('homeCarouselPrev')?.addEventListener('click',()=>homeCarouselGo(homeCarouselIdx-1));document.getElementById('homeCarouselNext')?.addEventListener('click',()=>homeCarouselGo(homeCarouselIdx+1));loadHomeCarouselFromCloud();
          </script>'''
          text, n1 = re.subn(r'<script>\s*\(function renderFeaturedCarousel\(\)\{.*?\}\)\(\);\s*</script>', dynamic, text, count=1, flags=re.S)
          text, n2 = re.subn(r'<script>\s*const HOME_CAROUSEL_IMAGES=\[.*?</script>', '', text, count=1, flags=re.S)
          if n1 != 1 or n2 != 1: raise SystemExit(f'carousel blocks not found: first={n1}, final={n2}')
          payload=json.dumps({'message':'Connect homepage carousel to Supabase products','content':base64.b64encode(text.encode()).decode(),'sha':obj['sha'],'branch':'main'}).encode()
          put=urllib.request.Request(api,data=payload,method='PUT',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(put) as r: print(r.read().decode())
          PY
