name: Connect homepage carousel to cloud products

on:
  push:
    paths:
      - '.github/carousel-sync.trigger'

permissions:
  contents: write

jobs:
  connect-carousel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch homepage carousel
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          marker_start='<script id="jinshiuan-cloud-carousel">'
          marker_end='</script>'
          if marker_start in text:
              a=text.find(marker_start); b=text.find(marker_end,a)
              if b<0: raise SystemExit('Existing cloud carousel script is incomplete')
              text=text[:a]+text[b+len(marker_end):]
          admin=Path('admin.html').read_text(encoding='utf-8')
          km=re.search(r"SUPABASE_PUBLISHABLE_KEY=['\"]([^'\"]+)['\"]",admin)
          if not km: raise SystemExit('Could not read the existing Supabase publishable key from admin.html')
          supabase_key=km.group(1)
          dynamic=r'''<script id="jinshiuan-cloud-carousel">
          (async function(){
            const URL='https://mkujndpbwjwumcclafcd.supabase.co';
            const KEY='__SUPABASE_KEY__';
            const fallback=["assets/image-01.webp","assets/image-02.webp","assets/image-03.webp","assets/image-04.webp","assets/image-05.webp","assets/image-06.webp","assets/image-07.webp","assets/image-08.webp","assets/image-09.webp","assets/image-10.webp","assets/image-11.webp","assets/image-12.webp","assets/image-13.webp","assets/image-14.webp"];
            let images=fallback.slice(),idx=0,timer=null,rendering=false;
            const viewport=()=>document.getElementById('homeCarouselViewport');
            const dots=()=>document.getElementById('homeCarouselDots');
            function render(){const v=viewport(),d=dots();if(!v||!d||!images.length)return;if(rendering)return;rendering=true;idx=(idx+images.length)%images.length;v.innerHTML=images.map((src,i)=>'<div class="home-carousel-slide '+(i===idx?'active':'')+'"><img src="'+src+'" alt="JINSHIUAN Automotive Part '+String(i+1).padStart(2,'0')+'" loading="'+(i===0?'eager':'lazy')+'"></div>').join('');d.innerHTML=images.map((_,i)=>'<button type="button" class="home-carousel-dot '+(i===idx?'active':'')+'" aria-label="Product '+(i+1)+'"></button>').join('');rendering=false}
            function go(n){idx=(n+images.length)%images.length;render();start()}
            function start(){clearInterval(timer);timer=setInterval(()=>go(idx+1),4000)}
            async function load(){try{const r=await fetch(URL+'/rest/v1/products?select=images,sort_order&active=eq.true&order=sort_order.asc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw new Error('Supabase HTTP '+r.status);const rows=await r.json();const cloud=[];for(const p of (Array.isArray(rows)?rows:[])){for(const src of (Array.isArray(p.images)?p.images:[])){if(typeof src==='string'&&src.trim())cloud.push(src.trim())}}if(cloud.length)images=cloud}catch(e){console.warn('Cloud carousel unavailable; keeping existing images.',e)}render();start()}
            function wire(){const p=document.getElementById('homeCarouselPrev'),n=document.getElementById('homeCarouselNext');if(p){const x=p.cloneNode(true);p.replaceWith(x);x.addEventListener('click',()=>go(idx-1))}if(n){const x=n.cloneNode(true);n.replaceWith(x);x.addEventListener('click',()=>go(idx+1))}const d=dots();if(d)d.addEventListener('click',e=>{const b=e.target.closest('.home-carousel-dot');if(b){const all=[...d.querySelectorAll('.home-carousel-dot')];const i=all.indexOf(b);if(i>=0)go(i)}})}
            function observe(){const v=viewport();if(!v)return;new MutationObserver(()=>{if(!rendering){const current=[...v.querySelectorAll('img')].map(x=>x.getAttribute('src')||'');if(current.length!==images.length||current.some((x,i)=>x!==images[i]))render()}}).observe(v,{childList:true})}
            const wait=setInterval(()=>{if(viewport()){clearInterval(wait);wire();observe();load()}},100);
          })();
          </script>'''.replace('__SUPABASE_KEY__',supabase_key)
          pos=text.rfind('</body')
          if pos<0: raise SystemExit('index.html body tag not found')
          text=text[:pos]+dynamic+'\n'+text[pos:]
          index.write_text(text,encoding='utf-8')
          PY

      - name: Commit homepage carousel connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage carousel changes needed."
            exit 0
          fi
          git commit -m "Connect homepage carousel to cloud products"
          git push origin main
