name: Match building JS sign exactly
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only the building JS sign
        run: |
          python3 -m pip install --quiet pillow opencv-python-headless
          python3 - <<'PY'
          import cv2, numpy as np
          from PIL import Image
          building='assets/jinshiuan-building.png'
          header='assets/jinshiuan-logo-header.webp'
          base=cv2.imread(building)
          srcimg=cv2.imread(header)
          if base is None or srcimg is None: raise SystemExit('missing image')
          # Find the black square JS sign on the building facade.
          gray=cv2.cvtColor(base,cv2.COLOR_BGR2GRAY)
          mask=((gray<70).astype(np.uint8)*255)
          mask[:180,:]=0; mask[430:,:]=0; mask[:,:350]=0; mask[:,750:]=0
          n,lab,stats,cent=cv2.connectedComponentsWithStats(mask,8)
          cand=[]
          for i in range(1,n):
            x,y,w,h,a=stats[i]
            if 60<=w<=180 and 60<=h<=180 and 0.75<=w/h<=1.25 and a>3000:
              cand.append((a,x,y,w,h))
          if not cand: raise SystemExit('building JS sign not found')
          _,x,y,w,h=max(cand)
          # Find the black square emblem in the website header logo.
          g=cv2.cvtColor(srcimg,cv2.COLOR_BGR2GRAY)
          m=((g<70).astype(np.uint8)*255)
          n,lab,stats,cent=cv2.connectedComponentsWithStats(m,8)
          hc=[]
          H,W=g.shape
          for i in range(1,n):
            xx,yy,ww,hh,a=stats[i]
            if 0.75<=ww/hh<=1.25 and 40<=ww<=H*0.35 and 40<=hh<=H*0.35 and a>1000:
              hc.append((a,xx,yy,ww,hh))
          if not hc: raise SystemExit('header JS emblem not found')
          _,sx,sy,sw,sh=min(hc,key=lambda z:z[1])
          pad=max(2,int(min(sw,sh)*0.03))
          sx=max(0,sx-pad); sy=max(0,sy-pad); sw=min(W-sx,sw+2*pad); sh=min(H-sy,sh+2*pad)
          logo=srcimg[sy:sy+sh,sx:sx+sw]
          # Map the exact header emblem to the existing building sign plane.
          src=np.float32([[0,0],[sw-1,0],[sw-1,sh-1],[0,sh-1]])
          dst=np.float32([[x,y],[x+w-1,y],[x+w-1,y+h-1],[x,y+h-1]])
          M=cv2.getPerspectiveTransform(src,dst)
          warp=cv2.warpPerspective(logo,M,(base.shape[1],base.shape[0]),flags=cv2.INTER_LANCZOS4,borderMode=cv2.BORDER_CONSTANT,borderValue=(255,255,255))
          poly=np.int32(dst)
          mm=np.zeros((base.shape[0],base.shape[1]),np.uint8); cv2.fillConvexPoly(mm,poly,255)
          base[mm>0]=warp[mm>0]
          cv2.imwrite(building,base,[cv2.IMWRITE_PNG_COMPRESSION,6])
          print('building sign:',x,y,w,h,'header emblem:',sx,sy,sw,sh)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jinshiuan-building.png
          git rm .github/workflows/match-building-js-sign.yml
          git commit -m "Match building JS sign exactly"
          git push
