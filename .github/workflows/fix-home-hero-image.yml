name: Fix JINSHIUAN Homepage Hero Asset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix homepage hero image asset path'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix hero image path
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'assets/jinshiuan-home-hero.webp"'
          new = 'assets/jinshiuan-home-hero.webp.png"'
          if old in text:
              text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix homepage hero image asset path"
          git push

          rm -f .github/workflows/fix-home-hero-image.yml
          git add .github/workflows/fix-home-hero-image.yml
          git commit -m "Remove one-time hero asset repair workflow"
          git push
