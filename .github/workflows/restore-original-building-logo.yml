name: Restore original building logo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact original building image
        run: |
          curl -L --fail -o assets/jinshiuan-building.png https://raw.githubusercontent.com/jinshiuan/jinshiuan.github.io/7c4f37ade64247172e8e6fa24e060abd475147cc/assets/jinshiuan-building.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jinshiuan-building.png
          git rm .github/workflows/restore-original-building-logo.yml
          git commit -m "Restore original building JS logo"
          git push
