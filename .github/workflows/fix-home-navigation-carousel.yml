name: Fix embedded homepage header and carousel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[hero-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove embedded header from homepage hero image
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('assets/jinshiuan-home-hero.webp.png')
          dst = Path('assets/jinshiuan-home-hero-cropped.webp')
          if src.exists():
              im = Image.open(src).convert('RGB')
              w, h = im.size
              # The supplied hero artwork contains an old website header across
              # the top. Detect the transition from the mostly-white header to
              # the colorful hero area, with a conservative fallback.
              y0 = max(1, int(h * 0.06))
              crop_y = int(h * 0.12)
              for y in range(y0, int(h * 0.22)):
                  sample = im.crop((0, y, w, min(h, y + max(2, h // 180))))
                  pix = list(sample.resize((80, 4)).getdata())
                  sat = sum(max(p) - min(p) for p in pix) / (len(pix) * 255)
                  if sat > 0.12:
                      crop_y = max(1, y - max(2, h // 120))
                      break
              crop_y = min(crop_y, int(h * 0.20))
              im.crop((0, crop_y, w, h)).save(dst, 'WEBP', quality=92, method=6)
              print(f'Created {dst} from {src}; crop_y={crop_y}, size={w}x{h}')
          PY

      - name: Clean duplicate homepage carousel initializers
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep the Supabase/fallback carousel initializer and remove the two
          # older competing initializers that repeatedly overwrite its DOM.
          s = re.sub(
              r'\n\(function renderFeaturedCarousel\(\)\{.*?\n\}\)\(\);\n',
              '\n', s, count=1, flags=re.S
          )
          s = re.sub(
              r'\n<script>\s*const HOME_CAROUSEL_IMAGES=.*?</script>',
              '', s, count=1, flags=re.S
          )

          # Use the cropped hero asset so the old embedded website header is gone.
          s = s.replace(
              'assets/jinshiuan-home-hero.webp.png',
              'assets/jinshiuan-home-hero-cropped.webp'
          )
          p.write_text(s, encoding='utf-8')

      - name: Commit and remove one-time fixer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/jinshiuan-home-hero-cropped.webp .github/workflows/fix-home-navigation-carousel.yml
          if git diff --cached --quiet; then exit 0; fi
          git rm .github/workflows/fix-home-navigation-carousel.yml
          git commit -m 'Remove embedded homepage header and stabilize carousel [hero-fix]'
          git push
