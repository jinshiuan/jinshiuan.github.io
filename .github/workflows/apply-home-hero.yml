name: Restore JINSHIUAN Homepage Clean Hero

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply clean homepage hero and move Products below'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore clean base and apply one-time layout
        shell: bash
        run: |
          set -e
          git checkout ad5aa6ba31e57f308e86b50ea15334cdabcc9327 -- index.html

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '/* JINSHIUAN_CLEAN_HOME_HERO */'
          if marker in text:
              raise SystemExit(0)

          css = '''<style>
          /* JINSHIUAN_CLEAN_HOME_HERO */
          .hero{background:#fff!important;padding:0!important;margin:0!important;}
          .hero .hero-inner{width:100%!important;max-width:none!important;margin:0!important;padding:0!important;display:flex!important;flex-direction:column!important;gap:0!important;align-items:stretch!important;}
          .hero .hero-inner::before{content:"";display:block;width:100%;height:clamp(420px,38vw,620px);background:url("assets/jinshiuan-home-hero.webp") center center/cover no-repeat;order:0;flex:0 0 auto;}
          .hero .hero-inner>.hero-product,.hero .hero-inner>.hero-copy{display:none!important;}
          .hero .hero-inner>:nth-child(3){order:1!important;width:100%!important;max-width:none!important;margin:0!important;padding:28px 24px 34px!important;box-sizing:border-box!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;background:#fff!important;}
          @media(max-width:700px){
            .hero .hero-inner::before{height:58vw;min-height:240px;max-height:420px;background-position:center center;}
            .hero .hero-inner>:nth-child(3){padding:22px 12px 28px!important;}
          }
          </style>'''

          if re.search(r'</head>', text, flags=re.I):
              text = re.sub(r'</head>', css + '\n</head>', text, count=1, flags=re.I)
          else:
              text = css + '\n' + text
          p.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply clean homepage hero and move Products below"
          git push

          rm -f .github/workflows/apply-home-hero.yml
          git add .github/workflows/apply-home-hero.yml
          git commit -m "Remove one-time homepage repair workflow"
          git push
