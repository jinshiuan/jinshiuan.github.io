name: Fix building logo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove incorrect white mark beside J
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageFilter
          p='assets/jinshiuan-building.png'
          im=Image.open(p).convert('RGB')
          pix=im.load()
          mask=Image.new('L', im.size, 0)
          mp=mask.load()
          for y in range(321,339):
              for x in range(530,557):
                  r,g,b=pix[x,y]
                  if r>165 and g>165 and b>165:
                      mp[x,y]=255
          mask=mask.filter(ImageFilter.MaxFilter(3))
          black=Image.new('RGB', im.size, (20,20,20))
          im.paste(black, mask=mask)
          im.save(p, 'PNG', optimize=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jinshiuan-building.png
          git rm .github/workflows/fix-building-logo.yml
          git commit -m "Fix building JS logo"
          git push
