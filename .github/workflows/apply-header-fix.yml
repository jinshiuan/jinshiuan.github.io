name: Apply JINSHIUAN header sizing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-header-fix.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch header CSS only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = '<!-- JINSHIUAN_HEADER_FIX_START -->'
          end = '<!-- JINSHIUAN_HEADER_FIX_END -->'
          css = r'''<style id="jinshiuan-header-fix">
          /* Keep the existing header layout; only enlarge the supplied logo/wordmark proportionally. */
          img[src*="jinshiuan-logo-header"],
          img[src*="jinshiuan-logo-new"] {
            width: 118px !important;
            height: auto !important;
            max-width: none !important;
            object-fit: contain !important;
            box-shadow: none !important;
            filter: none !important;
          }
          img[src*="jinshiuan-company-name"] {
            width: 430px !important;
            height: auto !important;
            max-width: none !important;
            object-fit: contain !important;
            box-shadow: none !important;
            filter: none !important;
            margin-left: 14px !important;
          }
          </style>'''
          block = start + '\n' + css + '\n' + end
          if start in s and end in s:
              a = s.index(start)
              b = s.index(end, a) + len(end)
              s = s[:a] + block + s[b:]
          else:
              pos = s.lower().rfind('</head>')
              if pos == -1:
                  raise SystemExit('No </head> found; refusing to alter the page.')
              s = s[:pos] + block + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit header fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Adjust JINSHIUAN header logo and wordmark size'
          git push
