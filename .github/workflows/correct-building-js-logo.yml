name: Final building JS logo from website header
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore untouched building photo
        run: |
          curl -L --fail -o assets/jinshiuan-building.png https://raw.githubusercontent.com/jinshiuan/jinshiuan.github.io/59532c7c7d0d27695b5c9e4d70f3d27619c90059/assets/jinshiuan-building.png
      - name: Extract only the clean JS square from the website header
        run: |
          curl -L --fail -o /tmp/header.webp https://raw.githubusercontent.com/jinshiuan/jinshiuan.github.io/main/assets/jinshiuan-logo-header.webp
          python3 -m pip install --quiet pillow opencv-python-headless
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/header.webp').convert('RGB')
          # The header logo is the left square. The blue site underline is below
          # the square, so deliberately exclude the bottom site-decoration pixels.
          im.crop((0, 0, 70, 64)).save('/tmp/js.png')
          PY
      - name: Place the clean logo on the original building sign
        run: |
          python3 - <<'PY'
          import cv2, numpy as np
          logo=cv2.imread('/tmp/js.png',cv2.IMREAD_COLOR)
          building=cv2.imread('assets/jinshiuan-building.png',cv2.IMREAD_COLOR)
          if logo is None or building is None:
              raise SystemExit('image load failed')
          # Exact original sign plane on the supplied building image.
          dst=np.float32([[507,263],[601,263],[601,366],[506,377]])
          src=np.float32([[0,0],[69,0],[69,63],[0,63]])
          M=cv2.getPerspectiveTransform(src,dst)
          warped=cv2.warpPerspective(logo,M,(building.shape[1],building.shape[0]),flags=cv2.INTER_LANCZOS4)
          mask=np.zeros(building.shape[:2],np.uint8)
          cv2.fillConvexPoly(mask,np.int32(dst),255)
          building[mask>0]=warped[mask>0]
          cv2.imwrite('assets/jinshiuan-building.png',building,[cv2.IMWRITE_PNG_COMPRESSION,6])
          PY
      - name: Commit corrected building photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jinshiuan-building.png
          git commit -m "Clean building JS logo edges"
          git push