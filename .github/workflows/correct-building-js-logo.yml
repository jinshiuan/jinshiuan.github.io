name: Correct building JS logo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore the original building image
        run: |
          curl -L --fail -o assets/jinshiuan-building.png https://raw.githubusercontent.com/jinshiuan/jinshiuan.github.io/59532c7c7d0d27695b5c9e4d70f3d27619c90059/assets/jinshiuan-building.png

      - name: Copy the exact JS logo from the website header
        run: |
          curl -L --fail -o /tmp/header.webp https://raw.githubusercontent.com/jinshiuan/jinshiuan.github.io/main/assets/jinshiuan-logo-header.webp
          python3 -m pip install --quiet pillow opencv-python-headless
          python3 - <<'PY'
          from PIL import Image
          import cv2, numpy as np

          # The website header asset is 400x70. Its first 70x70 pixels are
          # the exact red-J / white-S / black-square JS logo shown on the site.
          header = Image.open('/tmp/header.webp').convert('RGBA')
          js = header.crop((0, 0, 70, 70))
          js.save('/tmp/js-logo.png')

          building = cv2.imread('assets/jinshiuan-building.png', cv2.IMREAD_COLOR)
          logo = cv2.imread('/tmp/js-logo.png', cv2.IMREAD_COLOR)
          if building is None or logo is None:
              raise SystemExit('image load failed')

          # Original sign plane on the building photo.
          dst = np.float32([[507,263],[601,263],[601,366],[506,377]])
          src = np.float32([[0,0],[69,0],[69,69],[0,69]])
          M = cv2.getPerspectiveTransform(src, dst)
          warped = cv2.warpPerspective(
              logo, M, (building.shape[1], building.shape[0]),
              flags=cv2.INTER_LANCZOS4
          )

          mask = np.zeros(building.shape[:2], np.uint8)
          cv2.fillConvexPoly(mask, np.int32(dst), 255)
          building[mask > 0] = warped[mask > 0]
          cv2.imwrite('assets/jinshiuan-building.png', building,
                      [cv2.IMWRITE_PNG_COMPRESSION, 6])
          PY

      - name: Commit the corrected building image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jinshiuan-building.png
          git commit -m "Use exact website JS logo on building"
          git push