name: Set JINSHIUAN header layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean JINSHIUAN header
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          cache = os.environ['GITHUB_SHA']

          # Remove all previous header overrides/scripts so old logo/text/CSS cannot stack.
          for sid in [
              'jinshiuan-company-name-fix',
              'jinshiuan-brand-name-style',
              'jinshiuan-header-brand-style',
              'jinshiuan-header-fix'
          ]:
              s = re.sub(r'<style id="' + re.escape(sid) + r'">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<script id="jinshiuan-company-name-script">.*?</script>\s*', '', s, flags=re.S)

          # One clean header: new JS logo + company name with the original J/S colors.
          header = '''<header class="topbar" id="top"><div class="wrap js-header-wrap"><a class="brand js-brand" href="#top" aria-label="JINSHIUAN AUTO PARTS LTD."><img class="js-header-logo" src="assets/jinshiuan-logo-new.webp?v=__CACHE__" alt="JINSHIUAN logo" loading="eager"><span class="js-header-company"><strong><b class="js-gold">J</b>IN<b class="js-silver">S</b>HIUAN</strong><span>AUTO PARTS LTD.</span></span></a><nav class="nav"><a href="#products" data-nav="products">Products</a><a href="#partsl-search" data-nav="partsl-search">PARTSLINK SEARCH</a><a href="#about" data-nav="about">About</a><a href="#contact" data-nav="contact">Contact</a></nav></div></header>'''.replace('__CACHE__', cache)
          s, n = re.subn(r'<header class="topbar" id="top">.*?</header>', header, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected exactly one topbar header, replaced {n}')

          css = '''<style id="jinshiuan-header-brand-style">
          .topbar{min-height:135px !important;height:135px !important;overflow:visible !important;position:relative !important}
          .js-header-wrap{display:flex !important;width:100% !important;align-items:center !important;justify-content:space-between !important;height:135px !important}
          .js-brand{display:flex !important;align-items:center !important;height:135px !important;flex:0 0 auto !important;min-width:0 !important;overflow:visible !important;position:relative !important;z-index:20 !important;text-decoration:none !important;line-height:1 !important;gap:12px !important}
          .js-header-logo{display:block !important;width:115px !important;height:115px !important;max-width:115px !important;max-height:115px !important;object-fit:contain !important;object-position:center !important;flex:0 0 115px !important;opacity:1 !important;visibility:visible !important;filter:none !important;-webkit-filter:none !important;box-shadow:none !important}
          .js-header-company{display:flex !important;flex-direction:column !important;justify-content:center !important;align-items:center !important;white-space:nowrap !important;text-shadow:none !important;filter:none !important;line-height:1 !important}
          .js-header-company strong{display:block !important;font-family:Arial,Helvetica,sans-serif !important;font-size:46px !important;font-weight:800 !important;letter-spacing:-1.5px !important;color:#151a1e !important;text-shadow:none !important;line-height:1 !important}
          .js-header-company strong b{font-weight:800 !important;font-style:normal !important}
          .js-header-company strong .js-gold{color:#d9a441 !important}
          .js-header-company strong .js-silver{color:#a8adb3 !important}
          .js-header-company span{display:block !important;margin-top:8px !important;font-family:Arial,Helvetica,sans-serif !important;font-size:19px !important;font-weight:700 !important;letter-spacing:4px !important;color:#151a1e !important;text-shadow:none !important;line-height:1 !important;transform:translateX(8px) !important}
          @media(max-width:1100px){.topbar{min-height:120px !important;height:120px !important}.js-header-wrap,.js-brand{height:120px !important}.js-header-logo{width:100px !important;height:100px !important;flex-basis:100px !important}.js-header-company strong{font-size:38px !important}.js-header-company span{font-size:16px !important;letter-spacing:3px !important}}
          @media(max-width:700px){.topbar{min-height:95px !important;height:95px !important}.js-header-wrap,.js-brand{height:95px !important}.js-header-logo{width:72px !important;height:72px !important;flex-basis:72px !important}.js-header-company strong{font-size:25px !important}.js-header-company span{font-size:11px !important;letter-spacing:2px !important;transform:translateX(5px) !important}}
          </style>'''
          s = re.sub(r'</head>', css + '\n</head>', s, count=1, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit corrected header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Restore JINSHIUAN J gold and S silver colors"
          git pull --rebase origin main
          git push
