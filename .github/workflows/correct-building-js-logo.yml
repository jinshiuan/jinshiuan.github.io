name: Set JINSHIUAN header image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace header logo area with supplied full company image
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          cache = os.environ['GITHUB_SHA']

          # Remove every previous company-name/header-image implementation.
          s = re.sub(r'<style id="jinshiuan-company-name-fix">.*?</style>\s*<script id="jinshiuan-company-name-script">.*?</script>\s*', '', s, flags=re.S)
          s = re.sub(r'<style id="jinshiuan-brand-name-style">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<style id="jinshiuan-header-brand-style">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<span class="site-header-company-name">\s*<img[^>]*>\s*</span>', '', s, flags=re.S)
          s = re.sub(r'<span class="site-brand-name-wrap">.*?</span>', '', s, flags=re.S)
          s = re.sub(r'<img class="site-brand-name-img"[^>]*>', '', s)

          # Replace the existing header logo image with ONE supplied image.
          pattern = r'<img src="(?:data:image/webp;base64,[^"]+|assets/jinshiuan-logo-header\.webp(?:\?v=[^"]+)?)"[^>]*>'
          replacement = f'<img class="site-header-full-brand" src="assets/jinshiuan-company-name.webp?v={cache}" alt="JINSHIUAN AUTO PARTS LTD." loading="eager">'
          s, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected exactly one existing header logo image, replaced {n}')

          css = '''<style id="jinshiuan-header-brand-style">
          .topbar{min-height:120px !important;height:120px !important;overflow:visible !important;position:relative !important}
          .brand{display:flex !important;align-items:center !important;height:120px !important;flex:0 1 auto !important;min-width:0 !important;overflow:visible !important;position:relative !important;z-index:20 !important}
          .brand > img.site-header-full-brand{display:block !important;width:440px !important;height:auto !important;max-width:440px !important;max-height:none !important;object-fit:contain !important;object-position:center center !important;flex:0 0 440px !important;margin:0 !important;padding:0 !important;opacity:1 !important;visibility:visible !important;filter:none !important;-webkit-filter:none !important;box-shadow:none !important;text-shadow:none !important}
          @media(max-width:1100px){.topbar{min-height:105px !important;height:105px !important}.brand{height:105px !important}.brand > img.site-header-full-brand{width:380px !important;max-width:380px !important;flex-basis:380px !important}}
          @media(max-width:700px){.topbar{min-height:85px !important;height:85px !important}.brand{height:85px !important}.brand > img.site-header-full-brand{width:300px !important;max-width:300px !important;flex-basis:300px !important}}
          </style>'''
          s = re.sub(r'</head>', css + '\n</head>', s, count=1, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit header-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Replace header with supplied company image"
          git push
