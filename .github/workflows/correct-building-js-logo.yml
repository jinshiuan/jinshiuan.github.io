name: Keep selected building image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply selected building image, logo and company name graphic
        run: |
          cp 'assets/jinshiuan-building-new(1).png' assets/jinshiuan-building.png
          if [ -f 'assets/jinshiuan-logo-new.webp' ]; then
            cp 'assets/jinshiuan-logo-new.webp' assets/jinshiuan-logo-header.webp
          fi
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          cache = os.environ['GITHUB_SHA']

          # Remove all earlier company-name injection blocks so only one clean implementation remains.
          s = re.sub(r'<style id="jinshiuan-company-name-fix">.*?</style>\s*<script id="jinshiuan-company-name-script">.*?</script>\s*', '', s, flags=re.S)
          s = re.sub(r'<span class="site-header-company-name">\s*<img[^>]*>\s*</span>', '', s, flags=re.S)
          s = re.sub(r'<style id="jinshiuan-brand-name-style">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<img class="site-brand-name-img"[^>]*>', '', s)

          # Refresh the existing header logo without changing its artwork.
          pattern = r'<img src="(?:data:image/webp;base64,[^"]+|assets/jinshiuan-logo-header\.webp(?:\?v=[^"]+)?)"'
          replacement = f'<img src="assets/jinshiuan-logo-header.webp?v={cache}"'
          s = re.sub(pattern, replacement, s, count=1)

          # Final header layout. The supplied 2000x355 artwork keeps its native ratio.
          # Desktop placement is approximately 5 cm to the right of the existing logo.
          brand_css = '''<style id="jinshiuan-brand-name-style">
          header:has(.site-brand-name-img){
            position:relative !important;
            min-height:92px !important;
            height:92px !important;
            overflow:visible !important;
          }
          .site-brand-name-img{
            position:absolute !important;
            left:540px !important;
            top:9px !important;
            display:block !important;
            width:390px !important;
            height:auto !important;
            max-width:none !important;
            max-height:none !important;
            margin:0 !important;
            padding:0 !important;
            flex:none !important;
            opacity:1 !important;
            visibility:visible !important;
            filter:none !important;
            backdrop-filter:none !important;
            -webkit-filter:none !important;
            mask:none !important;
            -webkit-mask:none !important;
            mix-blend-mode:normal !important;
            clip-path:none !important;
            object-fit:contain !important;
            image-rendering:auto !important;
            z-index:99999 !important;
            isolation:isolate !important;
          }
          @media(max-width:700px){
            header:has(.site-brand-name-img){
              min-height:72px !important;
              height:72px !important;
            }
            .site-brand-name-img{
              left:145px !important;
              top:8px !important;
              width:250px !important;
            }
          }
          </style>'''
          s = re.sub(r'</head>', brand_css + '\n</head>', s, count=1, flags=re.I)

          img_tag = f'<img class="site-brand-name-img" src="assets/jinshiuan-company-name.webp?v={cache}" alt="JINSHIUAN AUTO PARTS LTD." loading="eager">'
          img_pattern = r'(<img src="assets/jinshiuan-logo-header\.webp\?v=[^"]+"[^>]*>)'
          s = re.sub(img_pattern, r'\1' + img_tag, s, count=1)

          p.write_text(s, encoding='utf-8')
          PY
          sed -E -i "s#assets/jinshiuan-building\.png\?v=[^\"]+#assets/jinshiuan-building.png?v=${GITHUB_SHA}#g" index.html
      - name: Commit selected building image, logo, company name graphic and cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jinshiuan-building.png assets/jinshiuan-logo-header.webp index.html assets/jinshiuan-company-name.webp
          if git diff --cached --quiet; then
            echo "Building image, logo, company name graphic and cache version are already current."
            exit 0
          fi
          git commit -m "Finalize company name header layout"
          git push
