name: Final building JS logo from the website screenshot
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore untouched building photo
        run: |
          curl -L --fail -o assets/jinshiuan-building.png https://raw.githubusercontent.com/jinshiuan/jinshiuan.github.io/59532c7c7d0d27695b5c9e4d70f3d27619c90059/assets/jinshiuan-building.png
      - name: Put the exact red-J white-S website logo onto the sign
        env:
          LOGO_B64: 
        run: |
          python3 -m pip install --quiet pillow opencv-python-headless
          python3 - <<'PY'
          import os, base64, cv2, numpy as np
          from PIL import Image
          open('/tmp/js.png','wb').write(base64.b64decode(os.environ['LOGO_B64']))
          logo=cv2.imread('/tmp/js.png',cv2.IMREAD_COLOR)
          building=cv2.imread('assets/jinshiuan-building.png',cv2.IMREAD_COLOR)
          if logo is None or building is None:
              raise SystemExit('image load failed')
          # Original JS sign plane on the supplied building photo.
          dst=np.float32([[507,263],[601,263],[601,366],[506,377]])
          src=np.float32([[0,0],[63,0],[63,63],[0,63]])
          M=cv2.getPerspectiveTransform(src,dst)
          warped=cv2.warpPerspective(logo,M,(building.shape[1],building.shape[0]),flags=cv2.INTER_LANCZOS4)
          mask=np.zeros(building.shape[:2],np.uint8)
          cv2.fillConvexPoly(mask,np.int32(dst),255)
          building[mask>0]=warped[mask>0]
          cv2.imwrite('assets/jinshiuan-building.png',building,[cv2.IMWRITE_PNG_COMPRESSION,6])
          PY
      - name: Commit corrected building photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jinshiuan-building.png
          git commit -m "Fix building logo with exact website logo"
          git push