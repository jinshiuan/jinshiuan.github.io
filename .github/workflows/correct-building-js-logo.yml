name: Keep clean original building image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore clean original image and refresh cache version
        run: |
          cp assets/jinshiuan-building-clean.png assets/jinshiuan-building.png
          sed -E -i "s#assets/jinshiuan-building\.png\?v=[^\"]+#assets/jinshiuan-building.png?v=${GITHUB_SHA}#g" index.html
      - name: Commit clean image and cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jinshiuan-building.png index.html
          if git diff --cached --quiet; then
            echo "Building image and cache version are already current."
            exit 0
          fi
          git commit -m "Refresh clean building image cache"
          git push
