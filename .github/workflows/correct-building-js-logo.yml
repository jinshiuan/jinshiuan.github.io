name: Keep selected building image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply selected building image, logo and refresh cache version
        run: |
          cp 'assets/jinshiuan-building-new(1).png' assets/jinshiuan-building.png
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          cache = os.environ['GITHUB_SHA']
          pattern = r'<img src="(?:data:image/webp;base64,[^"]+|assets/jinshiuan-logo-header\.webp(?:\?v=[^"]+)?)"'
          replacement = f'<img src="assets/jinshiuan-logo-header.webp?v={cache}"'
          s = re.sub(pattern, replacement, s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
          sed -E -i "s#assets/jinshiuan-building\.png\?v=[^\"]+#assets/jinshiuan-building.png?v=${GITHUB_SHA}#g" index.html
      - name: Commit selected building image, logo and cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jinshiuan-building.png index.html
          if git diff --cached --quiet; then
            echo "Building image, logo and cache version are already current."
            exit 0
          fi
          git commit -m "Fix new website logo cache path"
          git push
