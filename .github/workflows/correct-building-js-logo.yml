name: Correct building JS logo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore untouched building image
        run: |
          curl -L --fail -o assets/jinshiuan-building.png https://raw.githubusercontent.com/jinshiuan/jinshiuan.github.io/7c4f37ade64247172e8e6fa24e060abd475147cc/assets/jinshiuan-building.png
      - name: Place exact rendered website JS logo
        env:
          LOGO_B64: 
        run: |
          python3 -m pip install --quiet pillow opencv-python-headless
          python3 - <<'PY'
          import os,base64,cv2,numpy as np
          open('/tmp/web-logo.png','wb').write(base64.b64decode(os.environ['LOGO_B64']))
          logo=cv2.imread('/tmp/web-logo.png',cv2.IMREAD_COLOR)
          building=cv2.imread('assets/jinshiuan-building.png',cv2.IMREAD_COLOR)
          if logo is None or building is None: raise SystemExit('image load failed')
          # Exact building sign plane from the original building image.
          dst=np.float32([[507,263],[601,263],[601,366],[506,377]])
          src=np.float32([[0,0],[63,0],[63,63],[0,63]])
          M=cv2.getPerspectiveTransform(src,dst)
          warped=cv2.warpPerspective(logo,M,(building.shape[1],building.shape[0]),flags=cv2.INTER_LANCZOS4)
          mask=np.zeros(building.shape[:2],np.uint8)
          cv2.fillConvexPoly(mask,np.int32(dst),255)
          building[mask>0]=warped[mask>0]
          cv2.imwrite('assets/jinshiuan-building.png',building,[cv2.IMWRITE_PNG_COMPRESSION,6])
          PY
      - name: Commit result and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jinshiuan-building.png
          git rm .github/workflows/correct-building-js-logo.yml
          git commit -m "Fix building logo using exact website logo"
          git push