name: Keep selected building image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply selected building image, logo and company name graphic
        run: |
          cp 'assets/jinshiuan-building-new(1).png' assets/jinshiuan-building.png
          if [ -f 'assets/jinshiuan-logo-new.webp' ]; then
            cp 'assets/jinshiuan-logo-new.webp' assets/jinshiuan-logo-header.webp
          fi
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          cache = os.environ['GITHUB_SHA']
          pattern = r'<img src="(?:data:image/webp;base64,[^"]+|assets/jinshiuan-logo-header\.webp(?:\?v=[^"]+)?)"'
          replacement = f'<img src="assets/jinshiuan-logo-header.webp?v={cache}"'
          s = re.sub(pattern, replacement, s, count=1)

          # The supplied company-name artwork is intentionally kept intact.
          # Use a larger, fixed header size and give the header enough height so
          # the second line (AUTO PARTS LTD.) is not clipped or blurred by the
          # site's existing global image/header rules.
          brand_css = '''<style id="jinshiuan-brand-name-style">
          header:has(.site-brand-name-img){min-height:92px !important;height:92px !important;overflow:visible !important;}
          .site-brand-name-img{
            display:block !important;
            width:390px !important;
            height:72px !important;
            max-width:390px !important;
            max-height:72px !important;
            min-width:390px !important;
            min-height:72px !important;
            object-fit:fill !important;
            object-position:center center !important;
            margin-left:14px !important;
            margin-top:4px !important;
            margin-bottom:0 !important;
            flex:0 0 390px !important;
            line-height:0 !important;
          }
          @media(max-width:700px){
            header:has(.site-brand-name-img){min-height:72px !important;height:72px !important;}
            .site-brand-name-img{
              width:250px !important;
              height:48px !important;
              max-width:250px !important;
              max-height:48px !important;
              min-width:250px !important;
              min-height:48px !important;
              flex-basis:250px !important;
              margin-left:8px !important;
              margin-top:2px !important;
            }
          }
          </style>'''
          if 'id="jinshiuan-brand-name-style"' not in s:
              s = re.sub(r'</head>', brand_css + '\n</head>', s, count=1, flags=re.I)
          else:
              s = re.sub(r'<style id="jinshiuan-brand-name-style">.*?</style>', brand_css.strip(), s, count=1, flags=re.S)

          img_tag = f'<img class="site-brand-name-img" src="assets/jinshiuan-company-name.webp?v={cache}" alt="JINSHIUAN AUTO PARTS LTD." loading="eager">'
          old_img = '<span class="site-brand-name">JINSHIUAN AUTO PARTS LTD.</span>'
          if 'class="site-brand-name-img"' in s:
              s = re.sub(r'<img class="site-brand-name-img"[^>]*>', img_tag, s, count=1)
          elif old_img in s:
              s = s.replace(old_img, img_tag, 1)
          else:
              img_pattern = r'(<img src="assets/jinshiuan-logo-header\.webp\?v=[^"]+"[^>]*>)'
              s = re.sub(img_pattern, r'\1' + img_tag, s, count=1)

          p.write_text(s, encoding='utf-8')
          PY
          sed -E -i "s#assets/jinshiuan-building\.png\?v=[^\"]+#assets/jinshiuan-building.png?v=${GITHUB_SHA}#g" index.html
      - name: Commit selected building image, logo, company name graphic and cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jinshiuan-building.png assets/jinshiuan-logo-header.webp index.html assets/jinshiuan-company-name.webp
          if git diff --cached --quiet; then
            echo "Building image, logo, company name graphic and cache version are already current."
            exit 0
          fi
          git commit -m "Make company name fully legible in header"
          git push
