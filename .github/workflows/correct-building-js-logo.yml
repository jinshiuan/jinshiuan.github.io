name: Restore original building wall
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore the original building image only
        run: |
          git checkout 59532c7c7d0d27695b5c9e4d70f3d27619c90059 -- assets/jinshiuan-building.png
      - name: Commit only if the building image changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/jinshiuan-building.png; then
            echo "Building image is already the original wall. Nothing to change."
            exit 0
          fi
          git add assets/jinshiuan-building.png
          git commit -m "Restore original building wall without logo"
          git push