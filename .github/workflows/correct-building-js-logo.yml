name: Restore exact original building image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact original image
        run: |
          git checkout 9d0120414239ff2f66cf0789876b951919ee2cd8 -- assets/jinshiuan-building.png
      - name: Commit exact original image only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jinshiuan-building.png
          if git diff --cached --quiet; then
            echo "Image is already the exact original."
            exit 0
          fi
          git commit -m "Restore exact original building image"
          git push