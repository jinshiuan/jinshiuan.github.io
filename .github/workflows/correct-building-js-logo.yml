name: Set JINSHIUAN header layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore correct header logo and company name layout
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          cache = os.environ['GITHUB_SHA']

          # Remove all previous header/company-name overrides so they cannot stack.
          for sid in [
              'jinshiuan-company-name-fix',
              'jinshiuan-brand-name-style',
              'jinshiuan-header-brand-style'
          ]:
              s = re.sub(r'<style id="' + re.escape(sid) + r'">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<script id="jinshiuan-company-name-script">.*?</script>\s*', '', s, flags=re.S)

          # Restore the original two-part header: JS logo + JINSHIUAN wordmark + crisp company name.
          header = '''<header class="topbar" id="top"><div class="wrap" style="display:flex;width:100%;align-items:center;justify-content:space-between"><a class="brand" href="#top" aria-label="JINSHIUAN AUTO PARTS"><img src="assets/jinshiuan-logo-header.webp?v=__CACHE__" alt="JINSHIUAN AUTO PARTS" loading="eager"><span class="site-brand-name-wrap"><span class="site-brand-name-top"><img src="assets/jinshiuan-company-name.webp?v=__CACHE__" alt="JINSHIUAN" loading="eager"></span><span class="site-brand-name-bottom">AUTO PARTS LTD.</span></span></a><nav class="nav"><a href="#products" data-nav="products">Products</a><a href="#partsl-search" data-nav="partsl-search">PARTSLINK SEARCH</a><a href="#about" data-nav="about">About</a><a href="#contact" data-nav="contact">Contact</a></nav></div></header>'''.replace('__CACHE__', cache)
          s, n = re.subn(r'<header class="topbar" id="top">.*?</header>', header, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected exactly one topbar header, replaced {n}')

          css = '''<style id="jinshiuan-brand-name-style">
          .topbar{min-height:120px !important;height:120px !important;overflow:visible !important;position:relative !important}
          .brand{display:flex !important;align-items:center !important;gap:40px !important;height:120px !important;flex:0 1 auto !important;min-width:0 !important;overflow:visible !important;position:relative !important;z-index:20 !important}
          .brand > img:first-child{display:block !important;width:120px !important;height:84px !important;max-width:120px !important;max-height:84px !important;object-fit:contain !important;object-position:center center !important;flex:0 0 120px !important;opacity:1 !important;visibility:visible !important;filter:none !important;-webkit-filter:none !important;box-shadow:none !important}
          .brand .site-brand-name-wrap{display:flex !important;flex-direction:column !important;align-items:center !important;justify-content:center !important;width:360px !important;max-width:360px !important;height:96px !important;flex:0 0 360px !important;overflow:visible !important;position:relative !important;z-index:21 !important}
          .brand .site-brand-name-top{display:block !important;width:360px !important;height:64px !important;overflow:hidden !important;position:relative !important}
          .brand .site-brand-name-top img{display:block !important;width:360px !important;height:auto !important;max-width:none !important;max-height:none !important;margin:0 !important;padding:0 !important;object-fit:contain !important;object-position:top center !important;opacity:1 !important;visibility:visible !important;filter:none !important;-webkit-filter:none !important}
          .brand .site-brand-name-bottom{display:block !important;margin-top:2px !important;color:#111 !important;font-family:Arial,Helvetica,sans-serif !important;font-size:20px !important;line-height:24px !important;font-weight:700 !important;letter-spacing:3px !important;white-space:nowrap !important;text-align:center !important;opacity:1 !important;visibility:visible !important;text-shadow:none !important}
          @media(max-width:1100px){.topbar{min-height:105px !important;height:105px !important}.brand{gap:28px !important;height:105px !important}.brand > img:first-child{width:105px !important;height:74px !important;max-width:105px !important;max-height:74px !important;flex-basis:105px !important}.brand .site-brand-name-wrap{width:320px !important;max-width:320px !important;flex-basis:320px !important}.brand .site-brand-name-top{width:320px !important;height:58px !important}.brand .site-brand-name-top img{width:320px !important}.brand .site-brand-name-bottom{font-size:18px !important;line-height:22px !important;letter-spacing:2.5px !important}}
          @media(max-width:700px){.topbar{min-height:90px !important;height:90px !important}.brand{gap:14px !important;height:90px !important}.brand > img:first-child{width:82px !important;height:60px !important;max-width:82px !important;max-height:60px !important;flex-basis:82px !important}.brand .site-brand-name-wrap{width:220px !important;max-width:220px !important;flex-basis:220px !important;height:70px !important}.brand .site-brand-name-top{width:220px !important;height:42px !important}.brand .site-brand-name-top img{width:220px !important}.brand .site-brand-name-bottom{font-size:12px !important;line-height:16px !important;letter-spacing:1.5px !important;margin-top:1px !important}}
          </style>'''
          s = re.sub(r'</head>', css + '\n</head>', s, count=1, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit corrected header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Restore correct header logo layout"
          git push
