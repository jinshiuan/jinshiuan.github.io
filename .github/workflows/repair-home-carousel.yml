name: Restore homepage carousel
on:
  push:
    paths:
      - '.github/carousel-repair.trigger'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known working carousel
        run: |
          git checkout b162f98a94b85027a51b4a50ebf6f71c3ceb623d -- index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore working homepage carousel"
          git push
