name: Inspect site HTML
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: ${{ !startsWith(github.event.head_commit.message, 'inspect:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect header and logo references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8', errors='ignore')
          out=[]
          pats=[r'(?is).{0,1200}(?:logo|JINSHIUAN|AUTO PARTS|header).{0,2000}', r'(?is)<header[^>]*>.*?</header>']
          for pat in pats:
              for m in re.finditer(pat,s):
                  out.append(m.group(0)[:5000])
                  if len(out)>=20: break
              if len(out)>=20: break
          Path('site-inspect.txt').write_text('\n\n---MATCH---\n\n'.join(out),encoding='utf-8')
          print('index bytes', len(s.encode()))
          print('matches', len(out))
          PY
      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site-inspect.txt
          git commit -m 'inspect: site html' || exit 0
          git push
