name: Inspect site HTML
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: ${{ !startsWith(github.event.head_commit.message, 'inspect:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect header and logo references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8', errors='ignore')
          out=[]
          for pat in [r'(?is)<header[^>]*>.*?</header>', r'(?is)<style[^>]*>.*?(?:topbar|site-brand-name|brand).*?</style>']:
              for m in re.finditer(pat,s):
                  text=m.group(0)
                  if any(x in text.lower() for x in ['topbar','site-brand-name','jinshiuan','logo']):
                      out.append(text[:12000])
          Path('site-inspect.txt').write_text('\n\n---MATCH---\n\n'.join(out[:10]),encoding='utf-8')
          print('index bytes', len(s.encode()), 'matches', len(out))
          PY
      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site-inspect.txt
          git commit -m 'inspect: site html' || exit 0
          git pull --rebase origin main
          git push
