name: Apply homepage redo

on:
  push:
    paths:
      - '.github/workflows/apply-homepage-redo.yml'

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'APPLY_HOMEPAGE_IMAGE_CHANGE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace homepage hero only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''<main><section class="hero"><div class="wrap hero-inner">
          <div class="hero-product"><div class="hero-static"><img src="assets/jinshiuan-building-new(1).png?v=2026092101" alt="JINSHIUAN Factory Building" loading="eager"></div></div>
          <div class="hero-copy"><div class="kicker">JINSHIUAN</div><h1>AUTO<br>PARTS</h1><p>Parts Development · Sourcing · Export</p><a class="btn" href="#products">VIEW PRODUCTS</a></div>
          <div class="hero-carousel"><div class="eyebrow">FEATURED PRODUCTS</div><div class="home-carousel-wrap"><div class="home-carousel-viewport" id="homeCarouselViewport"><div class="home-carousel-slide active"><img src="assets/image-01.webp" alt="JINSHIUAN Automotive Part 01" loading="eager"></div></div><button class="home-carousel-btn home-carousel-prev" id="homeCarouselPrev" type="button" aria-label="Previous">‹</button><button class="home-carousel-btn home-carousel-next" id="homeCarouselNext" type="button" aria-label="Next">›</button><div class="home-carousel-dots" id="homeCarouselDots"></div></div></div>
          </div></section>'''

          old = old.replace('          ', '')
          if old not in s:
              raise SystemExit('Target homepage hero block was not found; no changes made.')

          new = '''<main><section class="home-hero-image" aria-label="JINSHIUAN AUTO PARTS"><img src="assets/jinshiuan-home-hero.webp.png" alt="JINSHIUAN AUTO PARTS" loading="eager"></section>
          <section class="home-featured" aria-label="Featured Products"><div class="wrap"><div class="eyebrow">FEATURED PRODUCTS</div><div class="home-carousel-wrap"><div class="home-carousel-viewport" id="homeCarouselViewport"><div class="home-carousel-slide active"><img src="assets/image-01.webp" alt="JINSHIUAN Automotive Part 01" loading="eager"></div></div><button class="home-carousel-btn home-carousel-prev" id="homeCarouselPrev" type="button" aria-label="Previous">‹</button><button class="home-carousel-btn home-carousel-next" id="homeCarouselNext" type="button" aria-label="Next">›</button><div class="home-carousel-dots" id="homeCarouselDots"></div></div></div></section>'''
          new = new.replace('          ', '')
          s = s.replace(old, new, 1)

          css = '''
          <style id="homepage-redo-final">
          .home-hero-image{width:100%;background:#fff;overflow:hidden;line-height:0;position:relative;z-index:1}
          .home-hero-image img{display:block;width:100%;height:auto;max-width:none;object-fit:cover}
          .home-featured{background:#fff;padding:34px 0 50px;position:relative;z-index:2}
          .home-featured>.wrap{max-width:1240px}
          .home-featured>.wrap>.eyebrow{text-align:center;margin-bottom:12px}
          .home-featured .home-carousel-wrap{max-width:1100px}
          .home-featured .home-carousel-viewport{height:360px;border-radius:16px}
          .home-featured .home-carousel-slide img{padding:18px}
          @media(max-width:700px){
            .home-featured{padding:26px 0 38px}
            .home-featured .home-carousel-viewport{height:300px;border-radius:12px}
            .home-featured .home-carousel-slide img{padding:12px}
          }
          </style>
          '''.replace('          ', '')
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage redo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Homepage redo: hero image and featured products below" || exit 0
          git push
