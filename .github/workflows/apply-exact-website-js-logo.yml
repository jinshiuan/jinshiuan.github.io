        run: |
          python3 -m pip install --quiet pillow opencv-python-headless
          python3 - <<'PY'
          import os,base64,cv2,numpy as np
          open('/tmp/header.webp','wb').write(base64.b64decode(os.environ['LOGO_B64']))
          header=cv2.imread('/tmp/header.webp',cv2.IMREAD_COLOR)
          building=cv2.imread('assets/jinshiuan-building.png',cv2.IMREAD_COLOR)
          if header is None or building is None: raise SystemExit('image load failed')
          print('header',header.shape,'building',building.shape)
          # Locate the dark square emblem in the left side of the exact website logo.
          gray=cv2.cvtColor(header,cv2.COLOR_BGR2GRAY)
          mask=((gray<85).astype(np.uint8)*255)
          mask[:,int(header.shape[1]*0.34):]=0
          n,lab,stats,_=cv2.connectedComponentsWithStats(mask,8)
          candidates=[]
          for i in range(1,n):
            x,y,w,h,area=stats[i]
            ratio=w/h if h else 0
            if 0.75<ratio<1.25 and w>25 and h>25 and area>500:
              candidates.append((area,x,y,w,h))
          if not candidates: raise SystemExit('exact JS emblem not found')
          _,sx,sy,sw,sh=max(candidates)
          logo=header[sy:sy+sh,sx:sx+sw]
          print('exact website emblem bbox',sx,sy,sw,sh)
          # Existing black JS sign on the untouched building.
          gray2=cv2.cvtColor(building,cv2.COLOR_BGR2GRAY)
          m2=((gray2<70).astype(np.uint8)*255)
          m2[:150,:]=0; m2[450:,:]=0; m2[:,:350]=0; m2[:,750:]=0
          n,lab,stats,_=cv2.connectedComponentsWithStats(m2,8)
          bc=[]
          for i in range(1,n):
            x,y,w,h,area=stats[i]
            ratio=w/h if h else 0
            if .75<ratio<1.25 and 60<w<180 and 60<h<180 and area>3000:
              bc.append((area,x,y,w,h))
          if not bc: raise SystemExit('building JS sign not found')
          _,x,y,w,h=max(bc)
          print('building sign bbox',x,y,w,h)
          src=np.float32([[0,0],[sw-1,0],[sw-1,sh-1],[0,sh-1]])
          dst=np.float32([[x,y],[x+w-1,y],[x+w-1,y+h-1],[x,y+h-1]])
          M=cv2.getPerspectiveTransform(src,dst)
          warped=cv2.warpPerspective(logo,M,(building.shape[1],building.shape[0]),flags=cv2.INTER_LANCZOS4,borderMode=cv2.BORDER_CONSTANT,borderValue=(0,0,0))
          building[cv2.fillConvexPoly(np.zeros(building.shape[:2],np.uint8),np.int32(dst),255)>0]=warped[cv2.fillConvexPoly(np.zeros(building.shape[:2],np.uint8),np.int32(dst),255)>0]
          cv2.imwrite('assets/jinshiuan-building.png',building,[cv2.IMWRITE_PNG_COMPRESSION,6])
          PY
