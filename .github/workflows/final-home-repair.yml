name: Final JINSHIUAN Homepage Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Finalize JINSHIUAN homepage repair'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean homepage base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate legacy header and keep the clean homepage hero
        shell: bash
        run: |
          set -e
          git checkout 0affe0b44261a3ebf839c661cc4f1eb331716c0c -- index.html
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''<style id="jinshiuan-final-home-fix">
          header:not(.topbar){display:none !important;}
          body > nav:not(.nav){display:none !important;}
          .topbar{overflow:visible !important;position:relative !important;z-index:1000 !important;}
          .topbar .brand{overflow:visible !important;}
          .js-header-logo{object-fit:contain !important;object-position:center !important;max-width:none !important;max-height:none !important;}
          </style>'''

          s = re.sub(r'<style id="jinshiuan-final-home-fix">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'</head>', css + '\n</head>', s, count=1, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/final-home-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/final-home-repair.yml
          git commit -m "Finalize JINSHIUAN homepage repair"
          git push
