name: Clean building logo from original
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original building and place exact header emblem
        run: |
          python3 -m pip install --quiet pillow opencv-python-headless
          curl -L --fail -o /tmp/original-building.png https://raw.githubusercontent.com/jinshiuan/jinshiuan.github.io/7c4f37ade64247172e8e6fa24e060abd475147cc/assets/jinshiuan-building.png
          python3 - <<'PY'
          import cv2, numpy as np
          from PIL import Image
          base=cv2.imread('/tmp/original-building.png',cv2.IMREAD_COLOR)
          src=Image.open('assets/jinshiuan-logo-header.webp').convert('RGBA')
          a=np.array(src.getchannel('A'))
          ys,xs=np.where(a>10)
          if len(xs)==0: raise SystemExit('logo has no alpha')
          # Left emblem occupies the first part of the transparent horizontal logo.
          ex0,ex1=xs.min(),min(xs.max(), int(src.width*0.27))
          ey0,ey1=ys.min(),ys.max()
          crop=np.array(src)[ey0:ey1+1,ex0:ex1+1]
          ca=crop[:,:,3]
          # Tighten to the black square itself, excluding transparent/white margins.
          rgb=crop[:,:,:3]
          dark=((rgb[:,:,0]<80)&(rgb[:,:,1]<80)&(rgb[:,:,2]<80)&(ca>10)).astype(np.uint8)*255
          n,lab,stats,_=cv2.connectedComponentsWithStats(dark,8)
          boxes=[]
          for i in range(1,n):
            x,y,w,h,area=stats[i]
            if area>500 and .75<w/h<1.25:
              boxes.append((area,x,y,w,h))
          if not boxes: raise SystemExit('emblem square not found')
          _,x,y,w,h=max(boxes)
          logo=crop[y:y+h,x:x+w]
          lh,lw=logo.shape[:2]
          # Existing sign quadrilateral on the original building.
          dst=np.float32([[507,263],[601,263],[601,366],[506,377]])
          srcp=np.float32([[0,0],[lw-1,0],[lw-1,lh-1],[0,lh-1]])
          M=cv2.getPerspectiveTransform(srcp,dst)
          warped=cv2.warpPerspective(logo,M,(base.shape[1],base.shape[0]),flags=cv2.INTER_LANCZOS4,borderMode=cv2.BORDER_CONSTANT,borderValue=(0,0,0,0))
          alpha=warped[:,:,3:4].astype(np.float32)/255
          rgbw=warped[:,:,:3].astype(np.float32)
          base=(rgbw*alpha+base.astype(np.float32)*(1-alpha)).astype(np.uint8)
          cv2.imwrite('assets/jinshiuan-building.png',base,[cv2.IMWRITE_PNG_COMPRESSION,6])
          print('exact header emblem placed; source box',x,y,w,h)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jinshiuan-building.png
          git rm .github/workflows/clean-building-logo.yml
          git commit -m "Clean building logo from original"
          git push
