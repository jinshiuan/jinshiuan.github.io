name: Fix carousel additive sync
on:
  push:
    paths:
      - '.github/carousel-additive.trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make cloud images additive
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(cloud.length)images=cloud"
          new="if(cloud.length)images=fallback.concat(cloud.filter(x=>!fallback.includes(x)))"
          if old not in s:
              raise SystemExit('target text not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep original carousel images and append cloud images'
          git push
